name: Link official launch stylesheet

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/link_launch_css.yml'

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Link launch CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          text = p.read_text(encoding='utf-8')
          needle = '<link rel="stylesheet" href="styles.css">'
          addition = needle + '\n  <link rel="stylesheet" href="launch.css">'
          if 'href="launch.css"' not in text:
              if needle not in text:
                  raise SystemExit('styles.css link not found')
              text = text.replace(needle, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit final markup
        run: |
          git config user.name 'GymProgres CI'
          git config user.email 'dzienniktreningowy.app@gmail.com'
          git rm .github/workflows/link_launch_css.yml
          git add public/index.html
          git commit -m 'Website: link official launch styles'
          git push origin HEAD:main
